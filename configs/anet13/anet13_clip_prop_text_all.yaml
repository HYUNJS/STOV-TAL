# This is an updated config for using I3D on ActivtyNet, resulting in slightly
# better performance. To reproduce the setting in our paper, set
# max_seq_len: 160,
# n_mha_win_size: [11, 11, 11, 11, -1, -1],

dataset_name: anet13
train_split: ['training']
val_split: ['validation']
dataset: {
  json_file: ./data/anet13/annotations/validation_tal.json,
  # json_file: ./data/anet13/annotations/validation_nonK400_tal.json,
  # json_file: ./data/anet13/annotations/validation_K400_tal.json,
  feat_folder: ./data/anet13/vificlip_feats/F16_w16F_s4F_clip_trainval,
  class_agnostic: False,
  file_prefix: ~,
  file_ext: .npy,
  num_classes: 1,
  input_dim: 512,
  feat_stride: 4,
  num_frames: 16,
  default_fps: 30,
  trunc_thresh: 0.5,
  crop_ratio: [0.9, 1.0],
  # upsample the features to a fixed length of 192
  max_seq_len: 192,
  force_upsampling: True,
}
CLIP: {
  inf_only: True,
  # weight: "./checkpoints/vifi_clip/vifi_clip_10_epochs_k400_full_finetuned.pth",
  ## inference details
  softmax: True,
#  softmax: False,
  topk: 1,
#  topk: 2,
#  nms: False,
  nms: True,
}
model: {
  fpn_type: identity,
  max_buffer_len_factor: 1.0,
  # 192 - 96 - 48 - 24 - 12 - 6
  n_mha_win_size: [7, 7, 7, 7, 7, -1],
  n_head: 4,
  embd_dim: 256,
  fpn_dim: 256,
  head_dim: 256,
  use_abs_pe: True,
}
opt: {
  ## ver1
  # learning_rate: 0.001,
  # epochs: 10,
  ## ver2
  learning_rate: 0.0001,
  epochs: 10,
  # ## ver3
  # learning_rate: 0.00001,
  # epochs: 10,

  weight_decay: 0.05,
  warmup_epochs: 5,
}
loader: {
  batch_size: 16,
  num_workers: 4,
}
train_cfg: {
  init_loss_norm: 200,
  clip_grad_l2norm: 1.0,
  cls_prior_prob: 0.01,
  center_sample: radius,
  center_sample_radius: 1.5,
  label_smoothing: 0.1,
  droppath: 0.1,
  loss_weight: 2.0,
  run_val: False,
}

# similar to THUMOS
test_cfg: {
  #  load_ema: False,
  nms_method: 'none',
  voting_thresh: 0.9,
  pre_nms_topk: 2000,
  # max of 100 predictions per video
  max_seg_num: 100,
  min_score: 0.001,
  # score fusion
  multiclass_nms: False,
  nms_sigma : 0.75,
  # ext_score_file: ./data/anet_1.3/annotations/cuhk_val_simp_share.json,
  duration_thresh: 0.001,
}
output_folder: ./ckpt/AN_agn_all
ckpt_folder: ./ckpt/AN_agn_all/anet13_clip_prop_all_3
